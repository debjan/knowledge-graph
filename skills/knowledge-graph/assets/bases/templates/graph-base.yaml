# Per-project knowledge graph dashboard
# Location: Memory/{project}/graph.base

filters:
  or:
    - file.inFolder("Memory/{project}/entities")
    - file.inFolder("Memory/{project}/concepts")
    - file.inFolder("Memory/{project}/decisions")
    - file.inFolder("Memory/{project}/constraints")
    - file.inFolder("Memory/{project}/processes")

formulas:
  days_since_used: 'if(usage.last_used, (now() - date(usage.last_used)).days.round(), "never")'

  # Lifecycle state: NONE → CREATED → ACTIVE → STALE → DEPRECATED → DELETED
  # Maps entity to its position in the lifecycle (immutable)
  lifecycle_state: |
    if(health.needs_delete,
      "DEPRECATED",
      if(health.needs_update || health.stale_files && health.stale_files.length > 0,
        "STALE",
        if(!usage.last_used || usage.use_count == 0,
          "CREATED",
          if((now() - date(usage.last_used)).days > 90,
            "STALE",
            "ACTIVE"))))

  # Health action status: what action is needed
  health_action: |
    if(health.needs_delete,
      "⚠️ Delete",
      if(health.needs_update,
        "🔄 Update",
        if(health.stale_files && health.stale_files.length > 0,
          "⏰ Verify Stale Files",
          if(usage.last_used && (now() - date(usage.last_used)).days > 60,
            "📅 Aging",
            "✓ OK"))))

  # Legacy health_status for backward compatibility
  health_status: 'if(health.needs_delete, "Delete", if(health.needs_update, "Update", "OK"))'

  activity_level: 'if(usage.use_count > 5, "Active", if(usage.use_count > 0, "Used", "Never"))'

properties:
  type:
    displayName: "Type"
  importance:
    displayName: "Importance"
  status:
    displayName: "Status"
  formula.lifecycle_state:
    displayName: "Lifecycle State"
  formula.health_action:
    displayName: "Health Action"
  formula.health_status:
    displayName: "Health Status"
  formula.days_since_used:
    displayName: "Days Since Used"
  formula.activity_level:
    displayName: "Activity"
  usage.use_count:
    displayName: "Use Count"

views:
  - type: table
    name: "Overview"
    order:
      - file.name
      - type
      - importance
      - formula.lifecycle_state
      - formula.health_action
      - formula.days_since_used

  - type: table
    name: "Needs Attention"
    filters:
      or:
        - "health.needs_update == true"
        - "health.needs_delete == true"
        - "health.stale_files.length > 0"
    order:
      - file.name
      - type
      - formula.lifecycle_state
      - formula.health_action
      - usage.use_count

  - type: table
    name: "By Lifecycle State"
    groupBy:
      property: formula.lifecycle_state
      direction: ASC
    order:
      - file.name
      - importance
      - formula.health_action
      - usage.last_used

  - type: cards
    name: "By Category"
    groupBy:
      property: type
      direction: ASC
    order:
      - file.name
      - importance
      - formula.lifecycle_state
      - formula.health_action

  - type: table
    name: "Recent Activity"
    order:
      - file.name
      - usage.last_used
      - formula.activity_level
    limit: 20
