# OBSIDIAN BASES FORMAT: YAML (.base file)
# MUST be valid YAML for Obsidian-Bases compatibility
#
# DIRECTORY REQUIREMENT:
# All folders must exist before first use:
#   {graph_path}/entities/
#   {graph_path}/concepts/
#   {graph_path}/decisions/
#   {graph_path}/constraints/
#   {graph_path}/processes/
#
# See `../../ops/ADD.md` Step 11 for folder creation

# Global filters - use 'and:', 'or:', or 'not:' structure ONLY
filters:
  or:
    - file.inFolder("{project}/entities")
    - file.inFolder("{project}/concepts")
    - file.inFolder("{project}/decisions")
    - file.inFolder("{project}/constraints")
    - file.inFolder("{project}/processes")

formulas:
  days_since_used: 'if(usage.last_used, (now() - date(usage.last_used)).days.round(), "never")'
  lifecycle_state: |
    if(health.needs_delete, "DEPRECATED",
      if(health.needs_update || health.stale_files != null && health.stale_files.length > 0, "STALE",
        if(!usage.last_used || usage.use_count == 0, "CREATED",
          if((now() - date(usage.last_used)).days > 90, "STALE", "ACTIVE"))))
  health_action: |
    if(health.needs_delete, "⚠️ Delete",
      if(health.needs_update, "🔄 Update",
        if(health.stale_files != null && health.stale_files.length > 0, "⏰ Verify Stale Files",
          if(usage.last_used && (now() - date(usage.last_used)).days > 60, "📅 Aging", "✓ OK"))))
  health_status: 'if(health.needs_delete, "Delete", if(health.needs_update, "Update", if(health.stale_files != null && health.stale_files.length > 0, "Stale", "OK")))'
  relevance_score: |
    let importance_weight = if(importance == "high", 1.0, if(importance == "medium", 0.7, 0.4))
    let days_old = if(usage.last_used, (now() - date(usage.last_used)).days, 90)
    let recency_factor = 1.0 / (1.0 + days_old / 30.0)
    let usage_norm = min(usage.use_count / 5.0, 1.0)
    round(importance_weight * recency_factor * usage_norm, 2)
  activity_level: 'if(usage.use_count > 5, "Active", if(usage.use_count > 0, "Used", "Never"))'

properties:
  title:
    displayName: "Name"
  type:
    displayName: "Type"
  importance:
    displayName: "Importance"
  status:
    displayName: "Status"
  formula.lifecycle_state:
    displayName: "Lifecycle State"
  formula.health_action:
    displayName: "Health Action"
  formula.health_status:
    displayName: "Health Status"
  formula.days_since_used:
    displayName: "Days Since Used"
  formula.activity_level:
    displayName: "Activity"
  formula.relevance_score:
    displayName: "Relevance"
  usage.use_count:
    displayName: "Use Count"

views:
  - type: table
    name: "Overview"
    order:
      - file.name
      - title
      - type
      - importance
      - formula.lifecycle_state
      - formula.health_action
      - formula.days_since_used

  - type: table
    name: "Needs Attention"
    filters:
      or:
        - 'health.needs_update == true'
        - 'health.needs_delete == true'
        - 'health.stale_files.length > 0'
    order:
      - file.name
      - title
      - type
      - formula.lifecycle_state
      - formula.health_action
      - usage.use_count

  - type: table
    name: "By Lifecycle State"
    filters:
      and:
        - file.inFolder("{project}")
    groupBy:
      property: formula.lifecycle_state
      direction: ASC
    order:
      - file.name
      - title
      - importance
      - formula.health_action
      - usage.last_used

  - type: cards
    name: "By Category"
    groupBy:
      property: type
      direction: ASC
    order:
      - file.name
      - title
      - importance
      - formula.lifecycle_state
      - formula.health_action

  - type: table
    name: "Recent Activity"
    order:
      - file.name
      - title
      - usage.last_used
      - formula.activity_level
    limit: 20

  - type: table
    name: "By Relevance"
    order:
      - file.name
      - title
      - formula.relevance_score DESC
      - importance
      - formula.lifecycle_state
      - usage.last_used
